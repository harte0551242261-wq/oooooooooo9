<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f8f86">
<title>البحث عن شهادة شكر وتقدير | ثانوية الملك خالد</title>
<style>
:root{--green:#0f8f86;--blue:#1687b8;--ink:#17323a;--muted:#65777d;--bg:#f4f8f8;--card:#fff;--border:#d8e5e6}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#edf7f6 0,#f8fbfb 45%,#fff 100%);color:var(--ink)}
header{background:linear-gradient(110deg,var(--green),var(--blue));color:#fff;padding:30px 18px;text-align:center;box-shadow:0 4px 18px #0f60672c}
header h1{font-size:clamp(23px,4.5vw,38px);margin:0 0 8px}header p{margin:0;opacity:.95;font-size:15px}
main{width:min(1050px,94%);margin:24px auto 50px}.searchbox{background:#fff;border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 10px 35px #285a5a12}
.label{font-weight:700;margin-bottom:9px;display:block}.searchrow{display:flex;gap:10px;flex-wrap:wrap}.searchrow input{flex:1;min-width:220px;border:2px solid #cee1e2;border-radius:13px;padding:15px 16px;font-size:18px;outline:none;text-align:right}.searchrow input:focus{border-color:var(--green);box-shadow:0 0 0 4px #0f8f8612}.btn{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--green);color:#fff}.hint{font-size:13px;color:var(--muted);margin:10px 2px 0}.status{text-align:center;color:var(--muted);padding:26px 8px}.result{display:none;margin-top:22px}.cert-card{background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 10px 35px #285a5a18;margin-bottom:20px}.cert-head{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border)}.cert-head strong{font-size:18px}.cert-head span{font-size:13px;color:var(--muted)}.preview-wrap{background:#eaf0f0;padding:14px;text-align:center}.preview-wrap img{display:block;width:100%;height:auto;max-width:1000px;margin:auto;background:white;box-shadow:0 3px 14px #0002}.actions{display:flex;gap:9px;flex-wrap:wrap;padding:15px}.download{background:#087f78;color:#fff}.print{background:#176b92;color:#fff}.share{background:#344a50;color:#fff}.open{background:#eef5f5;color:#21464a;border:1px solid #cfdfdf}.note{font-size:13px;color:#576a70;padding:0 16px 16px}.footer{text-align:center;color:#718288;font-size:13px;padding:16px 0 28px}@media(max-width:600px){header{padding:24px 14px}.searchbox{padding:15px}.searchrow .btn{width:100%}.actions .btn{flex:1;min-width:135px}.preview-wrap{padding:7px}}
@media print{header,.searchbox,.cert-head,.actions,.note,.footer,.status{display:none!important}body,main,.result,.cert-card,.preview-wrap{margin:0!important;padding:0!important;background:#fff!important;border:0!important;box-shadow:none!important;width:100%!important}.cert-card{display:block!important}.preview-wrap img{width:100%!important;max-width:none!important;box-shadow:none!important}}
</style>
</head>
<body>
<header><h1>البحث عن شهادة شكر وتقدير</h1><p>ثانوية الملك خالد - الإدارة العامة للتعليم بمحافظة الطائف</p></header>
<main>
<section class="searchbox">
<label class="label" for="nameInput">اكتب اسم ولي أمر الطالب</label>
<div class="searchrow"><input id="nameInput" type="search" autocomplete="name" placeholder="مثال: هشام عبد الله الطلحي"><button class="btn btn-primary" id="searchBtn">بحث عن الشهادة</button></div>
<div class="hint">يمكن البحث بالاسم كاملًا أو بجزء منه.</div>
</section>
<div id="status" class="status">اكتب الاسم ثم اضغط «بحث عن الشهادة».</div>
<section id="results" class="result"></section>
<div class="footer">جميع الشهادات المعروضة مأخوذة مباشرة من ملف PDF الأصلي دون إعادة تصميم.</div>
</main>
<script>
const certificates = [{"name": "هشام عبد الله الطلحي", "page": 1, "pdf": "certificates/certificate-01.pdf", "preview": "previews/page-01.png"}, {"name": "باسم ماهر الثمالي", "page": 2, "pdf": "certificates/certificate-02.pdf", "preview": "previews/page-02.png"}, {"name": "باسم البراء مسعود", "page": 3, "pdf": "certificates/certificate-03.pdf", "preview": "previews/page-03.png"}, {"name": "بندر عبدالرحمن البكيلي", "page": 4, "pdf": "certificates/certificate-04.pdf", "preview": "previews/page-04.png"}, {"name": "نايف سامي العتيبي", "page": 5, "pdf": "certificates/certificate-05.pdf", "preview": "previews/page-05.png"}, {"name": "عبدالعزيز سلطان الجعيد", "page": 6, "pdf": "certificates/certificate-06.pdf", "preview": "previews/page-06.png"}, {"name": "عبدالله بدر مصلح النفيعي", "page": 7, "pdf": "certificates/certificate-07.pdf", "preview": "previews/page-07.png"}, {"name": "سعد إبراهيم النفيعي", "page": 8, "pdf": "certificates/certificate-08.pdf", "preview": "previews/page-08.png"}, {"name": "حسن سعد حسن السفياني", "page": 9, "pdf": "certificates/certificate-09.pdf", "preview": "previews/page-09.png"}, {"name": "محمد عبد العزيز محمود", "page": 10, "pdf": "certificates/certificate-10.pdf", "preview": "previews/page-10.png"}, {"name": "معاذ عبده يوسف حمود", "page": 11, "pdf": "certificates/certificate-11.pdf", "preview": "previews/page-11.png"}, {"name": "محمد خالد الحارثي", "page": 12, "pdf": "certificates/certificate-12.pdf", "preview": "previews/page-12.png"}, {"name": "زياد يوسف دغريري", "page": 13, "pdf": "certificates/certificate-13.pdf", "preview": "previews/page-13.png"}, {"name": "عبدالرحمن عادل العتيبي", "page": 14, "pdf": "certificates/certificate-14.pdf", "preview": "previews/page-14.png"}, {"name": "فزاع حمد عوض الحارثي", "page": 15, "pdf": "certificates/certificate-15.pdf", "preview": "previews/page-15.png"}, {"name": "راكان ماجد علي الخديدي", "page": 16, "pdf": "certificates/certificate-16.pdf", "preview": "previews/page-16.png"}, {"name": "خالد عبدالرحمن حامد المالكي", "page": 17, "pdf": "certificates/certificate-17.pdf", "preview": "previews/page-17.png"}, {"name": "خليل احمد عبد الخليل", "page": 18, "pdf": "certificates/certificate-18.pdf", "preview": "previews/page-18.png"}, {"name": "يوسف حامد الطلحي", "page": 19, "pdf": "certificates/certificate-19.pdf", "preview": "previews/page-19.png"}, {"name": "عبدالعزيز حامد الطلحي", "page": 20, "pdf": "certificates/certificate-20.pdf", "preview": "previews/page-20.png"}, {"name": "الياس إبراهيم حواس", "page": 21, "pdf": "certificates/certificate-21.pdf", "preview": "previews/page-21.png"}, {"name": "ابرهيم مدحت سكيك", "page": 22, "pdf": "certificates/certificate-22.pdf", "preview": "previews/page-22.png"}, {"name": "أحمد خالد حمدي الطلحي", "page": 23, "pdf": "certificates/certificate-23.pdf", "preview": "previews/page-23.png"}];
const input=document.getElementById('nameInput'),btn=document.getElementById('searchBtn'),results=document.getElementById('results'),statusEl=document.getElementById('status');
function norm(s){return (s||'').toLowerCase().normalize('NFKD').replace(/[\u064B-\u065F\u0670]/g,'').replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^\u0600-\u06FFa-z0-9]/gi,'');}
function safe(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function render(list){results.innerHTML='';if(!list.length){results.style.display='none';statusEl.style.display='block';statusEl.textContent='لم يتم العثور على شهادة بهذا الاسم. تأكد من الاسم أو جرّب جزءًا منه.';return;}statusEl.style.display='none';results.style.display='block';for(const c of list){const card=document.createElement('article');card.className='cert-card';card.innerHTML=`<div class="cert-head"><strong>${safe(c.name)}</strong><span>شهادة رقم ${c.page}</span></div><div class="preview-wrap"><img src="${c.preview}" alt="شهادة ${safe(c.name)}" loading="eager"></div><div class="actions"><a class="btn download" href="${c.pdf}" download="شهادة-${safe(c.name)}.pdf">⬇ تحميل PDF</a><button class="btn print" type="button" data-print="${c.pdf}">🖨 طباعة</button><button class="btn share" type="button" data-share="${c.page}">↗ مشاركة</button><a class="btn open" href="${c.pdf}" target="_blank" rel="noopener">فتح PDF الأصلي</a></div><div class="note">المعاينة والملف القابل للتحميل من الصفحة الأصلية نفسها في ملف الشهادات.</div>`;results.appendChild(card);}
}
function search(){const q=norm(input.value);if(!q){results.style.display='none';statusEl.style.display='block';statusEl.textContent='فضلاً اكتب اسم ولي الأمر أولاً.';return;}let list=certificates.filter(c=>norm(c.name).includes(q));if(!list.length){const parts=input.value.trim().split(/\s+/).map(norm).filter(Boolean);list=certificates.filter(c=>parts.every(p=>norm(c.name).includes(p)));}render(list);const u=new URL(location.href);u.searchParams.set('q',input.value.trim());history.replaceState(null,'',u);}
btn.addEventListener('click',search);input.addEventListener('keydown',e=>{if(e.key==='Enter')search();});
results.addEventListener('click',async e=>{const p=e.target.closest('[data-print]');if(p){const w=window.open(p.dataset.print,'_blank');if(w){setTimeout(()=>{try{w.print()}catch(_){}},1200);}return;}const s=e.target.closest('[data-share]');if(s){const c=certificates.find(x=>String(x.page)===s.dataset.share);const shareUrl=new URL(location.href);shareUrl.search='';shareUrl.searchParams.set('q',c.name);try{const r=await fetch(c.pdf);const blob=await r.blob();const file=new File([blob],`شهادة-${c.name}.pdf`,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:`شهادة ${c.name}`,text:'شهادة شكر وتقدير',files:[file]});}else if(navigator.share){await navigator.share({title:`شهادة ${c.name}`,text:'شهادة شكر وتقدير',url:shareUrl.href});}else{await navigator.clipboard.writeText(shareUrl.href);alert('تم نسخ رابط الشهادة.');}}catch(err){if(err&&err.name!=='AbortError'){try{await navigator.clipboard.writeText(shareUrl.href);alert('تم نسخ رابط الشهادة.');}catch(_){alert('يمكنك فتح ملف PDF ثم استخدام زر المشاركة في جهازك.');}}}}});
const q=new URL(location.href).searchParams.get('q');if(q){input.value=q;search();}
</script>
</body></html>
